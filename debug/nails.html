<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nails-debug — HandLandmarker nail quads</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { position: relative; width: 100%; height: 100%; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #hud { position: absolute; top: 10px; left: 10px; z-index: 5; font: 13px/1.5 monospace;
         color: #0f0; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; white-space: pre; }
  #controls { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5;
              display: flex; gap: 8px; }
  button { font: 13px system-ui; padding: 8px 12px; border-radius: 8px; border: 1px solid #444;
           background: rgba(20,20,20,.85); color: #eee; cursor: pointer; }
  button.active { background: #1e6fd9; }
</style>
</head>
<body>
<div id="wrap">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="hud">loading…</div>
  <div id="controls">
    <button id="btnCam">rear camera</button>
    <button id="btnLm">landmarks</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.js"
        crossorigin="anonymous"></script>
<script>
"use strict";

const video = document.getElementById("cam");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");

const COLORS = ["#ff6b81", "#f7d794", "#82ccdd", "#78e08f", "#fda7df"];
// [tip, DIP] landmark indices.
const FINGERS = [[4, 3], [8, 7], [12, 11], [16, 15], [20, 19]];
const NEIGHBORS = [[1], [0, 2], [1, 3], [2, 4], [3]];

let handLandmarker = null;
let showLm = false;
let facing = "environment";
let stream = null;

const hudStats = { fps: 0, conf: "--" };
let frames = 0, lastFpsTs = performance.now();

(async () => {
  const fileset = await vision.FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  handLandmarker = await vision.HandLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  hud.textContent = "model loaded — start camera";
})();

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
  } catch (err) {
    hud.textContent = "camera error: " + err.message;
    return;
  }
  video.srcObject = stream;
  await video.play();
  const onFrame = () => {
    process();
    video.requestVideoFrameCallback(onFrame);
  };
  video.requestVideoFrameCallback(onFrame);
}

function process() {
  const ts = performance.now();
  frames++;
  if (ts - lastFpsTs >= 1000) {
    hudStats.fps = Math.round((frames * 1000) / (ts - lastFpsTs));
    frames = 0;
    lastFpsTs = ts;
  }
  if (!handLandmarker) return;

  const w = video.videoWidth || 0, h = video.videoHeight || 0;
  if (!w || !h) return;
  if (canvas.width !== w) { canvas.width = w; canvas.height = h; }
  ctx.clearRect(0, 0, w, h);

  const res = handLandmarker.detectForVideo(video, ts);
  if (res.handedness && res.handedness.length) {
    hudStats.conf = res.handedness[0][0].score.toFixed(2);
  }

  for (const hand of res.landmarks) {
    const pts = hand.map(p => [p.x * w, p.y * h]);
    if (showLm) drawLandmarks(pts);
    drawNails(pts);
  }

  hud.textContent =
    "fps " + hudStats.fps + "\n" +
    "conf " + hudStats.conf + "\n" +
    "hands " + (res.landmarks ? res.landmarks.length : 0);
}

function drawLandmarks(pts) {
  ctx.fillStyle = "rgba(255,255,0,.8)";
  for (const [x, y] of pts) {
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, 7);
    ctx.fill();
  }
}

function drawNails(pts) {
  // Precompute neighbour tip distances so width scales with the actual hand.
  const tips = FINGERS.map(([t]) => pts[t]);
  for (let i = 0; i < FINGERS.length; i++) {
    const [tipIdx, dipIdx] = FINGERS[i];
    const T = tips[i], D = pts[dipIdx];
    if (!T || !D) continue;

    let dx = T[0] - D[0], dy = T[1] - D[1];
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const px = -uy, py = ux; // perpendicular

    // Width estimate from distance to nearest adjacent fingertip, scaled down.
    let minAdj = Infinity;
    for (const n of NEIGHBORS[i]) {
      const ad = Math.hypot(T[0] - tips[n][0], T[1] - tips[n][1]);
      if (ad < minAdj) minAdj = ad;
    }
    let wHalf = (minAdj === Infinity ? len * 0.5 : minAdj * 0.35) / 2;
    wHalf = Math.max(len * 0.22, Math.min(wHalf, len * 0.38));

    // Nail: base slightly behind the tip, extends past it along the axis.
    const baseX = T[0] - ux * len * 0.18, baseY = T[1] - uy * len * 0.18;
    const endX = T[0] + ux * len * 0.32, endY = T[1] + uy * len * 0.32;

    const quad = [
      [baseX + px * wHalf, baseY + py * wHalf],
      [endX + px * wHalf, endY + py * wHalf],
      [endX - px * wHalf, endY - py * wHalf],
      [baseX - px * wHalf, baseY - py * wHalf]
    ];

    ctx.beginPath();
    ctx.moveTo(quad[0][0], quad[0][1]);
    for (let k = 1; k < 4; k++) ctx.lineTo(quad[k][0], quad[k][1]);
    ctx.closePath();
    ctx.fillStyle = COLORS[i];
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.35)";
    ctx.lineWidth = 1;
    ctx.stroke();

    // Faint highlight across the tip edge so rotation reads.
    ctx.beginPath();
    ctx.moveTo(quad[1][0], quad[1][1]);
    ctx.lineTo(quad[2][0], quad[2][1]);
    ctx.strokeStyle = "rgba(255,255,255,.45)";
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

document.getElementById("btnCam").addEventListener("click", () => {
  facing = facing === "environment" ? "user" : "environment";
  document.getElementById("btnCam").textContent = facing + " camera";
  startCamera();
});
document.getElementById("btnLm").addEventListener("click", () => {
  showLm = !showLm;
  document.getElementById("btnLm").classList.toggle("active", showLm);
});

startCamera();

// Camera requires a secure context (https or localhost).
if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
  hud.textContent = "open via https or localhost (camera API needs a secure context)";
}
</script>
</body>
</html>
